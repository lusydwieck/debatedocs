<!DOCTYPE html>
<html lang="en" class="h-full bg-white dark:bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full font-sans antialiased text-slate-800 dark:text-slate-100 bg-white dark:bg-slate-900">
  
  {% include header.html %}

  <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 flex">
    {{ content }}
  </div>

</body>
</html>
